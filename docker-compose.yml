services:
  postgres:
    image: postgres:16
    container_name: ek-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ek
      POSTGRES_PASSWORD: ekfinance
      POSTGRES_DB: ekfinance

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend

    container_name: ek-backend

    depends_on:
      - postgres

    volumes:
      - ./backend:/app

    ports:
      - "8000:8000"

    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data: